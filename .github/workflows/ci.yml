name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # Postgres for the holder pipeline tests (holderPipeline.db.test.js)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: holdex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/holdex_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # npm runs scripts under sh, where ** is just *, so the test script lists each
      # depth (src/*.test.js src/*/*.test.js). A test file nested deeper needs another pattern.
      - run: npm test

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.node-version
      # The frontend tests use only node:test, node:vm and fs, so there is nothing to install.
      # The root test script lists each depth (frontend/*.test.js frontend/js/*.test.js); a
      # test file in a new subdirectory needs its own pattern or it is silently skipped.
      - run: npm test
