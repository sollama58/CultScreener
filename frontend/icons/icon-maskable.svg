<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111215"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e64a19"/>
      <stop offset="40%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ff5722"/>
    </linearGradient>
    <linearGradient id="innerAccent" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Full bleed background for maskable safe zone -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Diamond shape centered in safe zone -->
  <g filter="url(#glow)" transform="translate(256,230)">
    <polygon points="0,-80 70,0 0,80 -70,0" fill="url(#accent)" opacity="0.9"/>
    <polygon points="0,-48 42,0 0,48 -42,0" fill="url(#innerAccent)" opacity="0.8"/>
  </g>
  <!-- "HD" text -->
  <text x="256" y="395" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="56" fill="#f0f0f2" letter-spacing="5">HD</text>
</svg>

