# Render Blueprint - HolDEX
# Deploy with: render blueprint apply
# Documentation: https://render.com/docs/blueprint-spec
#
# The frontend static site IS defined here (see HolDEX-frontend below). An older revision of
# this file said static sites couldn't be blueprint-managed; that hasn't been true for a while.
# It matters: frontend/_headers and frontend/_redirects are Netlify/Cloudflare Pages conventions
# that Render does not read - verified in production, where the site was serving no CSP, no
# X-Frame-Options and no Referrer-Policy at all, and where /trenches/deep-link 404'd. Header and
# rewrite config for a Render static site lives in this file (or the Dashboard), nowhere else.

services:
  # =====================================================
  # Backend API Service
  # =====================================================
  - type: web
    name: HolDEX-api
    runtime: node
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Database connection (auto-populated from Render PostgreSQL)
      - key: DATABASE_URL
        fromDatabase:
          name: HolDEX-db
          property: connectionString

      # Redis connection (auto-populated from Render Redis)
      - key: REDIS_URL
        fromService:
          type: redis
          name: HolDEX-redis
          property: connectionString

      # API Keys (set these manually in Render dashboard)
      - key: HELIUS_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      # Admin password (required for curated token management)
      - key: ADMIN_PASSWORD
        sync: false

      # Cookie signing secret (required — sessions invalidated on restart without this)
      - key: COOKIE_SECRET
        sync: false

      # SSL certificate verification for PostgreSQL (set to 'false' for Render's self-signed certs)
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"

      # Application settings
      - key: NODE_ENV
        value: production

      # CORS - Update this to your actual frontend URL after creating the static site
      - key: CORS_ORIGIN
        value: https://holdex.live,https://www.holdex.live

      # Rate limiting configuration
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"

      # Cache settings (seconds)
      - key: CACHE_TOKEN_TTL
        value: "300"
      - key: CACHE_PRICE_TTL
        value: "60"


  # =====================================================
  # Frontend Static Site
  # =====================================================
  # Publishes frontend/ from the repo root. The build step compiles the Trenches SPA
  # (trenches/) into frontend/trenches/, which is git-ignored and generated at deploy time.
  - type: web
    name: HolDEX-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./frontend

    # Render checks for a real file before applying any rule here ("Render does not apply
    # redirect or rewrite rules to a path if a resource exists at that path"), so the
    # /trenches/* rule cannot swallow the SPA's own hashed assets.
    routes:
      # Trenches SPA: hand any unmatched /trenches/* path to the app's entry document, so a
      # refresh or a pasted link lands in the app instead of a 404.
      - type: rewrite
        source: /trenches/*
        destination: /trenches/index.html
      # Extensionless URLs for the hand-authored pages.
      - type: rewrite
        source: /token/*
        destination: /token.html
      - type: rewrite
        source: /community
        destination: /community.html
      - type: rewrite
        source: /about
        destination: /about.html

    headers:
      # Security headers. These sat in frontend/_headers, which Render ignores, so production
      # served none of them - a wallet-connected site with no CSP and no clickjacking defence.
      #
      # Note the font hosts appear in connect-src as well as style-src/font-src. The service
      # worker caches Google Fonts for offline use, and a fetch() from a worker is checked
      # against connect-src whatever the resource's type - so with style-src alone the stylesheet
      # loaded fine normally and was refused the moment the worker intercepted it, which then
      # failed the request outright and left the page on its fallback fonts.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://cultscreener-api.onrender.com https://api.holdex.live https://solana-rpc.publicnode.com https://api.mainnet-beta.solana.com https://*.helius-rpc.com https://api.geckoterminal.com https://quote-api.jup.ag https://api.dexscreener.com; frame-src 'none'; object-src 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"

      # Caching. HTML keeps Render's default (max-age=0), which already revalidates on every
      # load - what the no-cache rules in _headers were after. The hand-authored JS/CSS keep
      # their filenames across deploys and are busted with ?v=N, so a short cache is safe.
      - path: /js/*
        name: Cache-Control
        value: "public, max-age=3600, stale-while-revalidate=86400"
      - path: /css/*
        name: Cache-Control
        value: "public, max-age=3600, stale-while-revalidate=86400"
      # The SPA's bundle is content-hashed: a changed file always has a new URL, so immutable.
      - path: /trenches/assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"

  # =====================================================
  # Background Worker (BullMQ job processor)
  # =====================================================
  - type: worker
    name: HolDEX-worker
    runtime: node
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      # Database connection (auto-populated from Render PostgreSQL)
      - key: DATABASE_URL
        fromDatabase:
          name: HolDEX-db
          property: connectionString

      # Redis connection (auto-populated from Render Redis)
      - key: REDIS_URL
        fromService:
          type: redis
          name: HolDEX-redis
          property: connectionString

      # API Keys — worker needs these for background jobs
      - key: HELIUS_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false

      # SSL certificate verification for PostgreSQL (set to 'false' for Render's self-signed certs)
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"

      # Application settings
      - key: NODE_ENV
        value: production

      # Worker performance tuning (starter plan has limited CPU — keep concurrency modest)
      - key: WORKER_CONCURRENCY
        value: "10"
      - key: WORKER_LIMITER_MAX
        value: "10"

  # =====================================================
  # Redis (BullMQ job queue)
  # =====================================================
  - type: redis
    name: HolDEX-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # Allow only internal Render services

# =====================================================
# PostgreSQL Database
# =====================================================
databases:
  - name: HolDEX-db
    plan: basic-256mb
    region: oregon
    databaseName: HolDEX
    user: HolDEX_user

# =====================================================
# MANUAL STEPS REQUIRED AFTER BLUEPRINT DEPLOYMENT:
#
# 1. Set API keys in Render Dashboard (Environment tab):
#    - HELIUS_API_KEY (required for holder analysis)
#    - ADMIN_PASSWORD (required for curated token management)
#    - COOKIE_SECRET (required for session persistence)
#    - COINGECKO_API_KEY (optional — higher rate limits)
#
# 2. The frontend Static Site (HolDEX-frontend) is now defined in this file, including its
#    headers and rewrites. HOWEVER: the live site was created by hand in the Dashboard and is
#    not yet linked to this Blueprint, so nothing above applies to it until one of these
#    happens. Pick one:
#
#    EITHER adopt the Blueprint (headers/rewrites become version-controlled from then on):
#      Dashboard > the static site > Settings > link it to this Blueprint, then re-deploy.
#      Check first that applying the Blueprint UPDATES the existing service rather than
#      creating a second one - a new service means a new URL and the api.holdex.live custom
#      domain would have to be moved.
#
#    OR set the same values by hand, which changes nothing about how the site is managed:
#      Settings > Redirects/Rewrites - add all four, Rewrite (not Redirect):
#        /trenches/*  ->  /trenches/index.html
#        /token/*     ->  /token.html
#        /community   ->  /community.html
#        /about       ->  /about.html
#      Settings > Headers - path /* for each, copying the values from the `headers:` block
#      above (Content-Security-Policy, X-Content-Type-Options, X-Frame-Options,
#      Referrer-Policy, Strict-Transport-Security, Permissions-Policy).
#
#    Until then the site serves NO security headers at all - confirmed in production.
#
#    NOTE ON THE ROOT/BUILD CHANGE (was: Root Directory "frontend", no build command):
#    The published tree is identical either way — Publish Directory "frontend" from the repo
#    root resolves to the same files that Root Directory "frontend" + Publish "." did, so every
#    existing page keeps its current URL. What changes:
#      - The build step now runs on every deploy. It compiles trenches/ into frontend/trenches/
#        (git-ignored, generated at deploy time). If that build fails, the WHOLE static site
#        deploy fails, where previously there was no build to fail. Render keeps serving the
#        last successful deploy, so a failure stalls updates rather than taking the site down.
#      - Auto-deploy now triggers on any change in the repo, not just frontend/, because the
#        service's root is the repo root.
#      - Deploys are slower (npm ci for the SPA's dependencies).
#
# 3. Update CORS_ORIGIN on HolDEX-api:
#    After creating the static site, copy its URL and update
#    the CORS_ORIGIN env var on the API service to match.
#    If using a custom domain, add both:
#      https://HolDEX-frontend.onrender.com,https://yourdomain.com
# =====================================================
